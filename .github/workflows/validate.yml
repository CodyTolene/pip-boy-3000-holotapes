name: Validate Holotapes

on:
  # Validation runs if any of these files change
  pull_request:
    paths:
      - '.github/workflows/validate.yml'
      - '.scripts/metadata.schema.json'
      - '.scripts/*.ts'
      - 'holotapes/**'
      - 'package.json'
      - 'package-lock.json'

  # Also validate after main is updated (sanity check)
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate.yml'
      - '.scripts/metadata.schema.json'
      - '.scripts/*.ts'
      - 'holotapes/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

# Cancel previous runs if a newer run is triggered for the same branch
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Holotape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate metadata against schema
        run: npm run validate-metadata

      - name: Check manifested files exist
        run: npm run check-files

      - name: Check registry.json is up to date
        run: |
          npm run build
          npm run format
          git diff --exit-code holotapes/registry.json

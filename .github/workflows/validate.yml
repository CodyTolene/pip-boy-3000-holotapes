name: Validate Holotapes

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/validate.yml'
      - '.scripts/**'
      - 'holotapes/**'
      - 'types/**'
      - 'eslint.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'prettier.config.cjs'
      - 'tsconfig.json'

concurrency:
  group: holotapes-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify sources and production build
        run: npm run verify

      - name: Reject committed build output
        shell: bash
        run: |
          # Holotapes must stay TypeScript sources in git; JS + registry are build artifacts only.
          # Fail the job if any .js/.JS (or registry.json) slipped into holotapes/.
          if find holotapes -type f \( -iname '*.js' -o -name 'registry.json' \) -print -quit | grep -q .; then
            echo 'Generated JavaScript and registry.json must not be committed.' >&2
            exit 1
          fi

      - name: Package production output
        working-directory: dist
        run: zip -q -r pip-boy-3000-holotapes.zip pip-boy-3000-holotapes

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-boy-3000-holotapes-${{ github.sha }}
          path: dist/pip-boy-3000-holotapes.zip
          if-no-files-found: error
          retention-days: 1
